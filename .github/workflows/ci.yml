name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      # The suite runs against a synthetic scenario, so it needs no FFmpeg and
      # no media on disk. If that ever stops being true this job will say so.
      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
